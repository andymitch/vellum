<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Vellum</title>
    <meta name="description" content="A local-first Markdown notes app." />
    <!-- Installable web app (#221/#222). The manifest and the service worker
         registration are injected by vite-plugin-pwa in the web build only;
         these tags are inert in the Tauri builds.

         iOS reads apple-touch-icon rather than the manifest icons, and needs
         apple-mobile-web-app-capable before 16.4 to launch full-screen. The
         status-bar style is deliberately left unset so iOS tints the bar from
         the theme-color meta, which theme.svelte.ts keeps in step with the
         chosen palette. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Vellum" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Apply the saved theme before paint to avoid a flash. Mirrors theme.svelte.ts. -->
    <script>
      try {
        // vellum-* are the current keys; fall back to the legacy notes-* keys
        // for the first launch after upgrade (before migrate-prefs.ts copies
        // them — that runs in the module bundle, after this inline script).
        var t = JSON.parse(
          localStorage.getItem("vellum-theme") ||
            localStorage.getItem("notes-theme") ||
            "{}",
        );
        if (t.palette && t.palette !== "things")
          document.documentElement.dataset.theme = t.palette;
        var mode = t.mode || "system";
        var dark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        // The Dynamic (Material You) theme has no CSS block — its colors come
        // from a native call. Apply the last cached tones now so it doesn't
        // flash the default palette before the async fetch resolves.
        if (t.palette === "dynamic") {
          var cached = JSON.parse(
            localStorage.getItem("vellum-monet") ||
              localStorage.getItem("notes-monet") ||
              "null",
          );
          var vars = cached && (dark ? cached.dark : cached.light);
          if (vars)
            for (var k in vars)
              document.documentElement.style.setProperty(k, vars[k]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
