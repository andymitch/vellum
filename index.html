<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>notes</title>
    <!-- Apply the saved theme before paint to avoid a flash. Mirrors theme.svelte.ts. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("notes-theme") || "{}");
        if (t.palette && t.palette !== "things")
          document.documentElement.dataset.theme = t.palette;
        var mode = t.mode || "system";
        var dark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
