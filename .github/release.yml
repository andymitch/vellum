# Categorizes GitHub's auto-generated release notes by PR label. Label your PRs
# (feature / enhancement / bug / chore) to sort them into these sections; the
# rest land under "Other".
changelog:
  categories:
    - title: ✨ Features
      labels: [feature, enhancement]
    - title: 🐛 Fixes
      labels: [bug]
    - title: 🔧 Maintenance
      labels: [chore, documentation, dependencies]
    - title: Other
      labels: ["*"]
