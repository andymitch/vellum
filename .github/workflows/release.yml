name: Release

# Tag-triggered (not CD): push a version tag like `v0.1.0` to build and publish.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # macOS desktop: .app/.dmg + signed updater artifacts + latest.json, via
  # tauri-action (which also creates the GitHub Release for this tag).
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install

      # The git tag is the single source of truth for the version; the value in
      # tauri.conf.json is only a local-dev placeholder. Stamp it from the tag
      # so the bundle + updater report vX.Y.Z.
      - name: Stamp version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          tmp=$(mktemp)
          jq --arg v "$V" '.version = $v' src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" src-tauri/tauri.conf.json
          echo "Building version $V"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vellum ${{ github.ref_name }}"
          releaseBody: "Download the `.dmg` (macOS) or `.apk` (Android) below. macOS build is unsigned — right-click → Open on first launch."
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

  # Android: build the unsigned release APK, sign it with the release keystore
  # (apksigner — avoids Tauri regenerating gradle's signingConfig), and attach
  # it to the release the desktop job created.
  android:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install

      # Tag is the source of truth (see desktop job). Tauri derives the Android
      # versionName + versionCode from this on build.
      - name: Stamp version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          tmp=$(mktemp)
          jq --arg v "$V" '.version = $v' src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" src-tauri/tauri.conf.json
          echo "Building version $V"

      - name: Build unsigned release APK
        run: bun tauri android build --apk --target aarch64

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          echo "$KS_B64" | base64 -d > release.jks
          "$BT/zipalign" -f -p 4 "$IN" vellum-release.apk
          "$BT/apksigner" sign --ks release.jks \
            --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            vellum-release.apk
          "$BT/apksigner" verify vellum-release.apk
          rm -f release.jks

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" vellum-release.apk --clobber
