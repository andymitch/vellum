name: Release

# One-click release: Actions → Release → "Run workflow". Pick a release type:
#   - major  (default): next vN tag, version N.0.0.
#   - hotfix: next point release off the latest major, vN.X / N.X.0 (#118).
#   - beta:   pre-release of the NEXT major, vN-beta.X / N.0.0-beta.X (#171).
# Builds macOS + Android, publishes a GitHub Release with categorized notes
# (see .github/release.yml). Versions stamp valid semver so Tauri/the updater
# are happy (N.0.0, N.X.0, or N.0.0-beta.X).
#
# A beta is published as a GitHub *pre-release*, which /releases/latest/ excludes
# — and that is the whole mechanism. Both the updater endpoint
# (tauri.conf.json) and the README download buttons resolve through
# /releases/latest/, so a beta is invisible to everyone who did not go looking
# for it. Semver precedence then returns testers to the stable track by itself:
# 8.0.0-beta.1 < 8.0.0, so the updater moves them onto v8 when it ships, while
# stable 7.0.0 is older than the beta so it never drags them backwards.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        type: choice
        options: [major, hotfix, beta]
        default: major

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prev: ${{ steps.v.outputs.prev }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        env:
          TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          TYPE="${TYPE:-major}"
          # A no-match grep is a legitimate state here (no tags yet -> first
          # release; no vN.* -> vN.1), so `|| true` keeps pipefail from aborting
          # on empty matches while still catching real git/sed/sort failures.
          # Latest major counter (point tags excluded by the ^v[0-9]+$ anchor).
          LATEST_MAJOR=$(git tag -l 'v*' | { grep -E '^v[0-9]+$' || true; } | sed 's/^v//' | sort -n | tail -1)
          PRERELEASE=false
          if [ "$TYPE" = "hotfix" ]; then
            if [ -z "$LATEST_MAJOR" ]; then echo "No major release to hotfix"; exit 1; fi
            N=$LATEST_MAJOR
            # Next point segment from existing vN.* tags (0 if none yet -> vN.1).
            X=$(git tag -l "v${N}.*" | { grep -E "^v${N}\.[0-9]+$" || true; } | sed "s/^v${N}\.//" | sort -n | tail -1)
            X=$(( ${X:-0} + 1 ))
            VERSION="${N}.${X}.0"; TAG="v${N}.${X}"
          elif [ "$TYPE" = "beta" ]; then
            # Beta of the NEXT major, so a run of betas leads up to one vN.
            N=$(( ${LATEST_MAJOR:-0} + 1 ))
            # Next beta counter from existing vN-beta.* tags (0 if none -> beta.1).
            B=$(git tag -l "v${N}-beta.*" | { grep -E "^v${N}-beta\.[0-9]+$" || true; } | sed "s/^v${N}-beta\.//" | sort -n | tail -1)
            B=$(( ${B:-0} + 1 ))
            VERSION="${N}.0.0-beta.${B}"; TAG="v${N}-beta.${B}"
            PRERELEASE=true
          else
            N=$(( ${LATEST_MAJOR:-0} + 1 ))
            VERSION="${N}.0.0"; TAG="v${N}"
          fi
          # prev = immediately preceding release: highest existing vN or vN.X
          # (version sort). The new TAG doesn't exist yet, so this is the prior
          # release — a major cut after a hotfix diffs against the hotfix.
          # Beta tags are excluded by the anchors, deliberately: a beta's notes
          # should cover everything since the last REAL release (that's what
          # testers need to exercise), and the eventual vN then still lists the
          # whole span rather than only what changed since the last beta.
          PREV=$(git tag -l 'v*' | { grep -E '^v[0-9]+(\.[0-9]+)?$' || true; } | sort -V | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Next release: $TAG (version $VERSION), prev ${PREV:-<none>}, prerelease=$PRERELEASE"
      # Create the release up front so desktop + android can upload to it in
      # parallel. tauri-action finds this existing release by tagName; the
      # android job uploads via `gh release upload`. (Previously tauri-action
      # created the release, forcing android to wait on the whole macOS build.)
      #
      # Created as a DRAFT — the notes job publishes it only after both builds
      # succeed. If either build fails, the release stays a hidden draft instead
      # of a public release missing one platform's artifact.
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=(--draft --target "${{ github.sha }}" --title "Vellum $TAG" --notes "Building…")
          # A pre-release is what keeps a beta out of /releases/latest/, so this
          # flag is the feature — not cosmetic.
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" "${FLAGS[@]}"

  # macOS desktop: .app/.dmg + signed updater artifacts + latest.json, via
  # tauri-action (which also creates the GitHub Release for the tag).
  desktop:
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install
      - name: Stamp version
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: |
          tmp=$(mktemp)
          jq --arg v "$V" '.version = $v' src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" src-tauri/tauri.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Vellum ${{ needs.prepare.outputs.tag }}"
          releaseBody: "Building…"
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          args: --target aarch64-apple-darwin
      # tauri-action attaches a version-stamped dmg (Vellum_N.0.0_aarch64.dmg),
      # whose name changes every release. Attach a stable-named copy too so the
      # README download button can point at a permanent
      # releases/latest/download/Vellum_aarch64.dmg URL.
      - name: Attach stable-named dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -e
          DMG=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$DMG" "Vellum_aarch64.dmg"
          gh release upload "$TAG" "Vellum_aarch64.dmg" --clobber
          # Drop the version-stamped dmg tauri-action attached; the stable-named
          # copy above replaces it, so we don't ship two identical dmgs.
          gh release delete-asset "$TAG" "$(basename "$DMG")" --yes

  # Android: build the release APK, sign it with the release keystore (apksigner
  # — Tauri regenerates gradle's signingConfig), attach it to the release.
  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install
      - name: Stamp version
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: |
          tmp=$(mktemp)
          jq --arg v "$V" '.version = $v' src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" src-tauri/tauri.conf.json
      - name: Build unsigned release APK
        run: bun tauri android build --apk --target aarch64
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          echo "$KS_B64" | base64 -d > release.jks
          "$BT/zipalign" -f -p 4 "$IN" vellum-release.apk
          "$BT/apksigner" sign --ks release.jks \
            --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            vellum-release.apk
          "$BT/apksigner" verify vellum-release.apk
          rm -f release.jks
      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" vellum-release.apk --clobber

  # Replace the release body with GitHub's categorized auto-generated notes
  # (per .github/release.yml), once all artifacts are attached.
  # Build categorized notes from the linked issue's label per merged PR
  # (fallback: the PR's own label), then set them as the release body.
  notes:
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate categorized release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREV: ${{ needs.prepare.outputs.prev }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          # The vN tag doesn't exist until the draft is published below, so diff
          # up to the release's target commit instead (avoids a compare 404).
          HEAD: ${{ github.sha }}
        run: |
          node scripts/release-notes.mjs > notes.md
          cat notes.md
          # Publish the draft now that both builds succeeded and all artifacts
          # are attached.
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md \
            --draft=false --prerelease="$PRERELEASE"
