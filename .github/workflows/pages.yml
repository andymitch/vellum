name: Pages

# Publishes to GitHub Pages (#106, #221):
#
#   /      the app itself, which iOS installs as a PWA
#   /app/  a redirect to /, so PWAs installed at the old address still launch
#
# Requires a one-time repo setting: Settings → Pages → Source = "GitHub Actions".
# Without it, the deploy step fails with "Pages site not found" — the workflow
# cannot enable Pages on its own.
#
# Runs on every push to main: the published artifact is the app, so a commit
# that didn't redeploy would leave the web version stale. The web app therefore
# tracks main — which is why
# it reports its version as the last tag plus the commits since (see the version
# stamp below), rather than pretending to be a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead. `cancel-in-progress: false` because
# an interrupted deploy would leave the published site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Full history so `git describe` can name the last release below.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: pages
        uses: actions/configure-pages@v5
      - uses: oven-sh/setup-bun@v2
      # The web app *is* the vault compiled to wasm now, so deploying it needs a
      # Rust toolchain. wasm-bindgen's CLI version must match the crate's
      # wasm-bindgen dependency or the glue it emits will not load.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/vellum-wasm
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: bun install --frozen-lockfile
      - name: Build the web app
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          # The base has to be baked in at build time — it prefixes every asset
          # URL, the web manifest and the service worker's scope. base_path is
          # "/vellum" for a project page and "/" for a user page or a custom
          # domain; the app sits at that base directly.
          BASE="${BASE_PATH:-/}"
          export VELLUM_BASE="${BASE%/}/"
          # Name the build after the last release plus the commits since it
          # (v10-beta.2+3), so a bug report from the web app says which code it
          # was running. Exactly a tag when the deploy is a release commit.
          export VELLUM_VERSION="$(git describe --tags --always | sed 's/-\([0-9]*\)-g[0-9a-f]*$/+\1/')"
          echo "base $VELLUM_BASE, version $VELLUM_VERSION"
          bun run build:web
      - name: Assemble the artifact
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          rm -rf _site
          cp -r build-web _site
          # The app used to live at /app/, and anything installed from there has
          # that baked into its start_url — removing the path outright would
          # make an installed PWA launch into a 404. A redirect keeps it opening.
          # Notes are unaffected either way: OPFS is scoped to the origin, not
          # the path, so the vault is the same one the new address reads.
          BASE="${BASE_PATH:-/}"
          mkdir -p _site/app
          cat > _site/app/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8" />
          <title>Vellum moved</title>
          <meta http-equiv="refresh" content="0; url=${BASE%/}/" />
          <link rel="canonical" href="${BASE%/}/" />
          <p>Vellum now lives at <a href="${BASE%/}/">${BASE%/}/</a>. Redirecting…</p>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
