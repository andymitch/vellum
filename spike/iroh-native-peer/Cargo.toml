[package]
name = "iroh-native-peer"
version = "0.0.0"
edition = "2021"
publish = false

# Native half of the browser<->native sync test. Same iroh versions as
# src-tauri, with default features (fs-store, rpc) left on — i.e. the stack the
# desktop app actually runs — so the test says something about the real pairing.
[dependencies]
iroh = "1.0.0"
iroh-docs = "0.101.0"
iroh-blobs = "0.103.0"
iroh-gossip = "0.101.0"
anyhow = "1"
futures-lite = "2"
tokio = { version = "1", features = ["full"] }
