<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>iroh wasm spike — persistence</title></head>
  <body>
    <pre id="log">booting…</pre>
    <script type="module">
      // Thin proxy to the worker that owns the vault. The page never touches
      // the node — the same split the real port would have.
      const worker = new Worker("./worker.js", { type: "module" });
      let next = 0;
      const pending = new Map();
      worker.onmessage = (e) => {
        const { id, ok, value, error } = e.data;
        const settle = pending.get(id);
        if (!settle) return;
        pending.delete(id);
        ok ? settle.resolve(value) : settle.reject(new Error(error));
      };
      const call = (cmd, ...args) =>
        new Promise((resolve, reject) => {
          const id = ++next;
          pending.set(id, { resolve, reject });
          worker.postMessage({ id, cmd, args });
        });

      window.api = {
        open: (file, ticket) => call("open", file, ticket ?? null),
        write: (key, value) => call("write", key, value),
        dump: () => call("dump"),
      };
      window.ready = Promise.resolve("ready");
      document.getElementById("log").textContent = "ready";
    </script>
  </body>
</html>
