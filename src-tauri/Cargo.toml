[package]
name = "vellum"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vellum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Name the desktop binary "Vellum". The lib is "vellum_lib", which the Android
# gradle/jniLibs load by name (System.loadLibrary("vellum_lib")). Without this
# the `tauri dev` binary would inherit the package name, which leaks into macOS
# prompts like "vellum can run in the background". Matches mainBinaryName in
# tauri.conf.json.
[[bin]]
name = "Vellum"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iroh = "1.0.0"
iroh-docs = "0.101.0"
iroh-blobs = "0.103.0"
iroh-gossip = "0.101.0"
anyhow = "1.0.102"
futures-lite = "2.6.1"
tokio = { version = "1.52.3", features = ["full"] }
rustls = { version = "0.23", features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
iroh-mdns-address-lookup = "0.4"
# Markdown export/import (#79): zip a vault's notes on export / unzip on import.
# No C deps (deflate via miniz_oxide). dialog picks the file; fs reads/writes it
# and abstracts Android's SAF content URIs — both needed on every platform.
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# Android-only: used to hand the JNI JavaVM + Context to ndk_context so iroh's
# network monitor works (Tauri doesn't populate ndk_context — see lib.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
# Route iroh logs to Android logcat (tracing-subscriber is in [dependencies]).
paranoid-android = "0.2"

[target.'cfg(any(target_os="android",target_os="ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"

# Desktop-only: in-app auto-update (Tauri's updater is desktop-only; mobile
# updates ship via the APK/stores). process is used to relaunch after update.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# (tauri-plugin-dialog is in [dependencies] — cross-platform for #79 + the
# desktop updater prompt.)
# Launch Vellum at login so an always-on desktop stays a sync hub across reboots
# (toggled with the Background sync setting).
tauri-plugin-autostart = "2"
# Keep the always-on hub a single process: a second launch (Finder/Dock click
# while the menu-bar agent is running) re-opens its window instead of starting a
# rival process that would contend for the iroh-docs store.
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

