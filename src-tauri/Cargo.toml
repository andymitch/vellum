[package]
name = "notes"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iroh = "1.0.0"
iroh-docs = "0.101.0"
iroh-blobs = "0.103.0"
iroh-gossip = "0.101.0"
anyhow = "1.0.102"
futures-lite = "2.6.1"
tokio = { version = "1.52.3", features = ["full"] }
rustls = { version = "0.23", features = ["ring"] }

# Android-only: used to hand the JNI JavaVM + Context to ndk_context so iroh's
# network monitor works (Tauri doesn't populate ndk_context — see lib.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
# iroh logs -> Android logcat (debugging cross-network sync)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
paranoid-android = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
